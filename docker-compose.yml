services:
  mongo:
    image: mongo:7
    container_name: ecocycle-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: ecocycle-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/ecocycle
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_me_too_in_production}
      - JWT_RESET_SECRET=${JWT_RESET_SECRET:-change_me_as_well_in_production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ecocycle.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123456}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./Frontend
    container_name: ecocycle-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
